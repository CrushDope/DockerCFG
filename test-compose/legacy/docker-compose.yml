services:
  app:
    image: nginx:1.25
    container_name: legacy_app
    restart: always
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./html:/usr/share/nginx/html:ro
    environment:
      TZ: Asia/Shanghai
      DEBUG: "false"
    depends_on:
      - db
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost
      interval: 30s
      retries: 3
    labels:
      maintainer: someone
    deploy:
      resources:
        limits:
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: 10m
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
    networks:
      - backend
networks:
  backend:
    driver: bridge
volumes:
  pgdata: null
